# محیط آزمایشی محلی وردپرس آیولب — فقط برای تست قبل از انتشار روی aiolab.ir
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes: [dbdata:/var/lib/mysql]
    mem_limit: 512m
    restart: unless-stopped
  wp:
    image: wordpress:php8.1-apache
    depends_on: [db]
    ports: ["127.0.0.1:8798:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wpdata:/var/www/html
      - ../plugin/aiolab-core:/var/www/html/wp-content/plugins/aiolab-core
      - ../theme/aiolab:/var/www/html/wp-content/themes/aiolab
    mem_limit: 768m
    restart: unless-stopped
  cli:
    image: wordpress:cli-php8.1
    depends_on: [db, wp]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ../plugin/aiolab-core:/var/www/html/wp-content/plugins/aiolab-core
      - ../theme/aiolab:/var/www/html/wp-content/themes/aiolab
    entrypoint: ["wp"]
    profiles: ["cli"]
volumes:
  dbdata:
  wpdata:
