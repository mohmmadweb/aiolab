<body data-page="products.html">

<header id="site-header" class="site-header"></header>

<div class="page-head">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">خانه</a> / <a href="companies.html">شرکت‌ها</a> / محصولات</div>
    <h1>محصولات و تجهیزات آزمایشگاهی</h1>
    <p>محصولاتی که شرکت‌ها و آزمایشگاه‌های عضو از پنل خود معرفی کرده‌اند. برای قیمت و شرایط، مستقیم از تأمین‌کننده استعلام بگیرید.</p>
  </div>
</div>
<section class="section" style="padding-top:24px">
  <div class="container">
    <div class="lab-filters">
      <input type="text" id="p-q" placeholder="نام محصول، برند یا مدل…" aria-label="جستجوی محصول">
      <select id="p-cat" aria-label="دسته"><option value="">همه دسته‌ها</option></select>
      <select id="p-org" aria-label="تأمین‌کننده"><option value="">همه تأمین‌کنندگان</option></select>
      <select id="p-sort" aria-label="مرتب‌سازی"><option value="">جدیدترین</option><option value="price">ارزان‌ترین</option><option value="name">نام</option></select>
      <label class="check-item inline"><input type="checkbox" id="p-price"> فقط دارای قیمت</label>
    </div>
    <p class="muted" id="p-count" style="margin:6px 0 14px"></p>
    <div class="prod-grid" id="p-grid"></div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/geo.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/talent-data.js"></script>
<script src="assets/js/match.js"></script>
<script src="assets/js/talent-ui.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("p-cat").insertAdjacentHTML("beforeend", AIO_PRODUCT_CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join(""));
  const orgIds = [...new Set(aioProducts().map(p => p.orgId))];
  document.getElementById("p-org").insertAdjacentHTML("beforeend", orgIds.map(id => orgFull(id)).filter(Boolean).map(o => `<option value="${o.id}">${o.name}</option>`).join(""));
  const q = new URLSearchParams(location.search);
  if (q.get("cat")) document.getElementById("p-cat").value = q.get("cat");
  if (q.get("org")) document.getElementById("p-org").value = q.get("org");
  document.querySelectorAll(".lab-filters input, .lab-filters select").forEach(el => el.addEventListener("input", render));
  render();
});
function render() {
  const t = document.getElementById("p-q").value.trim().toLowerCase(), cat = document.getElementById("p-cat").value,
        org = document.getElementById("p-org").value, sort = document.getElementById("p-sort").value, priced = document.getElementById("p-price").checked;
  let list = aioProducts().filter(p => (!t || (p.name + " " + (p.brand || "") + " " + (p.model || "")).toLowerCase().includes(t))
    && (!cat || p.cat === cat) && (!org || String(p.orgId) === org) && (!priced || p.price));
  if (sort === "price") list.sort((a, b) => (a.price || 1e15) - (b.price || 1e15));
  else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "fa"));
  else list.sort((a, b) => b.id - a.id);
  document.getElementById("p-count").textContent = fa(list.length) + " محصول";
  document.getElementById("p-grid").innerHTML = list.map(p => TUI.productCard(p)).join("")
    || '<div class="empty-state" style="grid-column:1/-1"><b>محصولی پیدا نشد</b>فیلترها را تغییر دهید.</div>';
}
</script>
</body>
</html>
