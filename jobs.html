<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرصت‌های شغلی | آیولب</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='4' width='40' height='40' rx='12' fill='%230d9488'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="jobs.html">

<header id="site-header" class="site-header"></header>

<div class="page-head">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">خانه</a> / فرصت‌های شغلی</div>
    <h1>فرصت‌های شغلی آزمایشگاهی</h1>
    <p>جستجوی تخصصی در میان آگهی‌های استخدام آزمایشگاه‌های تشخیص طبی و پژوهشی</p>
  </div>
</div>

<div class="container listing-layout">

  <!-- Filters -->
  <aside class="filters">
    <h3>فیلترها <button onclick="resetFilters()">حذف همه</button></h3>

    <div class="filter-group">
      <label>جستجو</label>
      <input type="text" id="f-q" placeholder="عنوان یا مهارت...">
    </div>

    <div class="filter-group">
      <label>شهر</label>
      <select id="f-city"><option value="">همه شهرها</option></select>
    </div>

    <div class="filter-group">
      <label>بخش آزمایشگاهی</label>
      <select id="f-dept"><option value="">همه بخش‌ها</option></select>
    </div>

    <div class="filter-group">
      <label>نوع همکاری</label>
      <div id="f-types"></div>
    </div>

    <div class="filter-group">
      <label>شیفت کاری</label>
      <div id="f-shifts"></div>
    </div>

    <div class="filter-group">
      <label>وضعیت آگهی</label>
      <label class="check-item"><input type="checkbox" id="f-urgent"> فقط آگهی‌های فوری</label>
      <label class="check-item"><input type="checkbox" id="f-featured"> فقط آگهی‌های ویژه</label>
    </div>
  </aside>

  <!-- Results -->
  <main class="listing-main">
    <div class="toolbar">
      <span class="count"><b id="count">۰</b> فرصت شغلی یافت شد</span>
      <select id="f-sort">
        <option value="new">جدیدترین</option>
        <option value="urgent">فوری‌ها اول</option>
        <option value="featured">ویژه‌ها اول</option>
      </select>
    </div>
    <div class="job-list" id="job-list"></div>
    <div class="empty-state" id="empty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <b>نتیجه‌ای یافت نشد</b>
      یکی از فیلترها را تغییر دهید یا حذف کنید.
    </div>
  </main>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
const TYPES = ["تمام‌وقت", "پاره‌وقت", "شیفتی", "موقت", "قراردادی"];
const SHIFTS = ["صبح", "عصر", "شب", "صبح و عصر"];

document.addEventListener("DOMContentLoaded", () => {
  const citySel = document.getElementById("f-city");
  AIO_CITIES.forEach(c => citySel.insertAdjacentHTML("beforeend", `<option>${c}</option>`));
  citySel.insertAdjacentHTML("beforeend", `<option>دورکار</option>`);
  const deptSel = document.getElementById("f-dept");
  AIO_DEPARTMENTS.forEach(d => deptSel.insertAdjacentHTML("beforeend", `<option value="${d.id}">${d.name}</option>`));
  document.getElementById("f-types").innerHTML = TYPES.map(t =>
    `<label class="check-item"><input type="checkbox" name="type" value="${t}"> ${t}</label>`).join("");
  document.getElementById("f-shifts").innerHTML = SHIFTS.map(s =>
    `<label class="check-item"><input type="checkbox" name="shift" value="${s}"> ${s}</label>`).join("");

  // apply URL params
  if (qs("q")) document.getElementById("f-q").value = qs("q");
  if (qs("city")) citySel.value = qs("city");
  if (qs("dept")) deptSel.value = qs("dept");
  if (qs("shift")) { const cb = document.querySelector(`input[name="shift"][value="${qs("shift")}"]`); if (cb) cb.checked = true; }

  document.querySelectorAll(".filters input, .filters select, #f-sort").forEach(el =>
    el.addEventListener("input", render));
  render();
});

function getChecked(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
}

function render() {
  const q = document.getElementById("f-q").value.trim();
  const city = document.getElementById("f-city").value;
  const dp = document.getElementById("f-dept").value;
  const types = getChecked("type");
  const shifts = getChecked("shift");
  const urgent = document.getElementById("f-urgent").checked;
  const featured = document.getElementById("f-featured").checked;
  const sort = document.getElementById("f-sort").value;

  let list = AIO_JOBS.filter(j => {
    const l = lab(j.labId);
    if (q && !(j.title + l.name + j.skills.join(" ")).includes(q)) return false;
    if (city && j.city !== city) return false;
    if (dp && j.dept !== dp) return false;
    if (types.length && !types.includes(j.type)) return false;
    if (shifts.length && !shifts.includes(j.shift)) return false;
    if (urgent && !j.urgent) return false;
    if (featured && !j.featured) return false;
    return true;
  });

  if (sort === "new") list.sort((a, b) => a.days - b.days);
  if (sort === "urgent") list.sort((a, b) => b.urgent - a.urgent || a.days - b.days);
  if (sort === "featured") list.sort((a, b) => b.featured - a.featured || a.days - b.days);

  document.getElementById("count").textContent = list.length.toLocaleString("fa-IR");
  document.getElementById("job-list").innerHTML = list.map(jobCardHTML).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}

function resetFilters() {
  document.querySelectorAll(".filters input[type=checkbox]").forEach(i => i.checked = false);
  document.getElementById("f-q").value = "";
  document.getElementById("f-city").value = "";
  document.getElementById("f-dept").value = "";
  render();
}
</script>
</body>
</html>
