name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # فقط فایل‌های سایت منتشر می‌شوند؛ پوشه Docs (اسناد داخلی) عمومی نمی‌شود
      - name: Build static output
        run: |
          mkdir dist
          cp *.html dist/
          cp -r assets dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create aiolab --production-branch=main 2>/dev/null || echo "project already exists"
          npx --yes wrangler@3 pages deploy dist --project-name=aiolab
