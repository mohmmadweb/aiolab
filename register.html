<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام | آیولب</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='4' width='40' height='40' rx='12' fill='%230d9488'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="register.html">

<header id="site-header" class="site-header"></header>

<div class="auth-wrap">
  <div class="auth-form-wrap">
    <form class="auth-form" onsubmit="doRegister(event)">
      <h1>ساخت حساب کاربری</h1>
      <p class="sub">در کمتر از یک دقیقه عضو آیولب شوید</p>

      <div class="demo-note">
        🧪 <b>حالت دمو:</b> اطلاعات شما جایی ذخیره نمی‌شود؛ فقط برای نمایش پروتوتایپ است.
      </div>

      <div class="role-switch">
        <button type="button" id="rb-seeker" class="active" onclick="setRole('seeker')">👤 کارجو هستم</button>
        <button type="button" id="rb-employer" onclick="setRole('employer')">🏥 کارفرما هستم</button>
      </div>

      <div class="form-field" id="f-name">
        <label id="name-label">نام و نام خانوادگی</label>
        <input type="text" id="name" placeholder="مثلاً: علی رضایی" required>
      </div>
      <div class="form-field" id="f-field" style="display:none">
        <label>نوع مرکز</label>
        <select id="center-type">
          <option>آزمایشگاه تشخیص طبی</option>
          <option>آزمایشگاه بیمارستانی</option>
          <option>آزمایشگاه ژنتیک</option>
          <option>مرکز پژوهشی</option>
          <option>شرکت تجهیزات آزمایشگاهی</option>
        </select>
      </div>
      <div class="form-field">
        <label>شماره موبایل</label>
        <input type="tel" id="phone" placeholder="09xxxxxxxxx" required>
      </div>
      <div class="form-field">
        <label>رمز عبور</label>
        <input type="password" id="pass" placeholder="حداقل ۸ کاراکتر" required>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit">ثبت‌نام</button>
      <div class="alt-link">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></div>
    </form>
  </div>

  <div class="auth-art">
    <svg viewBox="0 0 420 360" fill="none">
      <circle cx="210" cy="180" r="140" fill="#ffffff" opacity=".08"/>
      <path d="M210 60c-40 40-70 60-70 110a70 70 0 0 0 140 0c0-50-30-70-70-110z" fill="#f0fdfa" opacity=".92"/>
      <path d="M158 190h104a55 55 0 0 1-104 0z" fill="#2dd4bf"/>
      <circle cx="190" cy="210" r="5" fill="#fff" opacity=".6"/>
      <circle cx="222" cy="222" r="3.6" fill="#fff" opacity=".5"/>
    </svg>
    <h2>آینده شغلی‌ات را بساز</h2>
    <p>پروفایل تخصصی، تطبیق هوشمند شغل، دوره‌های مهارتی و شبکه حرفه‌ای — همه در یک پلتفرم.</p>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
let role = "seeker";
document.addEventListener("DOMContentLoaded", () => {
  if (qs("role") === "employer") setRole("employer");
});
function setRole(r) {
  role = r;
  document.getElementById("rb-seeker").classList.toggle("active", r === "seeker");
  document.getElementById("rb-employer").classList.toggle("active", r === "employer");
  document.getElementById("name-label").textContent = r === "employer" ? "نام مرکز / آزمایشگاه" : "نام و نام خانوادگی";
  document.getElementById("name").placeholder = r === "employer" ? "مثلاً: آزمایشگاه نور" : "مثلاً: علی رضایی";
  document.getElementById("f-field").style.display = r === "employer" ? "block" : "none";
}
function doRegister(e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim() || "کاربر آیولب";
  Auth.login(name, role === "employer" ? "employer" : "seeker");
  location.href = role === "employer" ? "employer.html" : "dashboard.html";
}
</script>
</body>
</html>
